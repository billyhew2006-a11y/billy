<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDA Portal - Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .forum-post { page-break-inside: avoid; break-inside: avoid; }
    </style>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, addDoc, updateDoc, deleteDoc, 
            collection, onSnapshot, query, serverTimestamp, 
            getDoc, getDocs, increment 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { 
            getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // --- Gatekeeper Script ---
        const userRole = sessionStorage.getItem('userRole');
        const username = sessionStorage.getItem('username');
        if (!userRole) {
            console.warn("No user role found in session. Redirecting to login.");
            window.location.href = 'portal.html';
        } else {
            console.log(`User role found: ${userRole}. Loading portal.`);
        }
        // -------------------------

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCSNoTcrBdewkCjOdGoubaKkAo8ZYvUYj0",
            authDomain: "sdaproductions-7f04d.firebaseapp.com",
            projectId: "sdaproductions-7f04d",
            storageBucket: "sdaproductions-7f04d.appspot.com",
            messagingSenderId: "372864946667",
            appId: "1:372864946667:web:ff348922a14a2a905009ae",
            measurementId: "G-54XVLP85NJ"
        };
        // ------------------------------------------------

        // Initialize Firebase
        let app, auth, db, storage;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            storage = getStorage(app);
            const analytics = getAnalytics(app);
        } catch (error) {
            console.error("Error initializing Firebase:", error);
            document.body.innerHTML = `<div class="p-8 text-red-400">Error connecting to portal. Firebase config may be invalid. ${error.message}</div>`;
        }
        
        // --- Global Variables ---
        let currentUserId = null;
        const postsCollectionRef = collection(db, "portals/sda-portal/posts");

        // --- Auth & Main App Logic ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Firebase auth successful, user:", user.uid);
                currentUserId = user.uid;
                initializeAppUI(userRole, username);
                loadPosts(userRole);
            } else {
                console.log("No user signed in, attempting anonymous auth...");
                signInAnonymously(auth).catch((error) => {
                    console.error("Firebase sign-in error:", error);
                    document.getElementById('status-message').textContent = `Error connecting to portal. Please try again. ${error.message}`;
                });
            }
        });

        // --- UI Initialization ---
        function initializeAppUI(role, loggedInUsername) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('portal-content').style.display = 'block';
            document.getElementById('welcome-message').textContent = `Welcome, ${loggedInUsername}!`;

            if (role === 'admin') {
                document.getElementById('admin-post-form').style.display = 'block';
            }

            const postForm = document.getElementById('post-form');
            const fileInput = document.getElementById('file-upload');
            const statusMessage = document.getElementById('status-message');

            postForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const postText = document.getElementById('post-text').value;
                const file = fileInput.files[0];

                if (!postText && !file) {
                    statusMessage.textContent = 'Please write a post or upload a file.';
                    return;
                }

                statusMessage.textContent = 'Posting...';
                let fileUrl = null;
                let fileName = null;

                try {
                    if (file) {
                        statusMessage.textContent = 'Uploading file...';
                        const storageRef = ref(storage, `forum-uploads/${Date.now()}_${file.name}`);
                        const uploadTask = await uploadBytesResumable(storageRef, file);
                        fileUrl = await getDownloadURL(uploadTask.ref);
                        fileName = file.name;
                        statusMessage.textContent = 'File uploaded. Posting...';
                    }

                    await addDoc(postsCollectionRef, {
                        text: postText,
                        fileUrl: fileUrl,
                        fileName: fileName,
                        createdAt: serverTimestamp(),
                        likes: 0,
                        author: loggedInUsername
                    });

                    postForm.reset();
                    statusMessage.textContent = 'Posted successfully!';
                    setTimeout(() => statusMessage.textContent = '', 3000);

                } catch (error) {
                    console.error("Error creating post:", error);
                    statusMessage.textContent = `Error posting: ${error.message}`;
                }
            });
        }

        // --- Load Posts ---
        function loadPosts(currentUserRole) {
            const postsContainer = document.getElementById('posts-container');
            
            const q = query(postsCollectionRef); // You can add orderBy('createdAt', 'desc') here
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    postsContainer.innerHTML = '<p class="text-slate-400">No posts yet. Be the first!</p>';
                    return;
                }

                postsContainer.innerHTML = '';
                snapshot.docs.forEach(postDoc => {
                    const post = postDoc.data();
                    const postId = postDoc.id;
                    postsContainer.appendChild(createPostElement(postId, post, currentUserRole));
                });

            }, (error) => {
                console.error("Error loading posts:", error);
                postsContainer.innerHTML = `<p class="text-red-400">Error loading posts: ${error.message}</p>`;
            });
        }

        // --- Create Post Element ---
        function createPostElement(postId, post, currentUserRole) {
            const postElement = document.createElement('div');
            postElement.className = 'forum-post bg-gray-800 border border-slate-700 rounded-lg shadow-lg p-6 mb-6';
            
            const postDate = post.createdAt ? post.createdAt.toDate().toLocaleString() : 'Just now';
            const author = post.author || 'Admin';
            
            let deleteButtonHtml = '';
            if (currentUserRole === 'admin') {
                deleteButtonHtml = `
                    <button data-post-id="${postId}" data-file-url="${post.fileUrl || ''}" 
                            class="delete-post-btn text-red-500 hover:text-red-400 text-sm font-medium">
                        Delete Post
                    </button>
                `;
            }

            let fileHtml = '';
            if (post.fileUrl) {
                fileHtml = `
                    <div class="mt-4 bg-gray-700 p-3 rounded-lg flex items-center justify-between">
                        <span class="text-indigo-400">${post.fileName || 'Attached File'}</span>
                        <a href="${post.fileUrl}" target="_blank" rel="noopener noreferrer" 
                           class="text-sm bg-indigo-600 hover:bg-indigo-700 text-white py-1 px-3 rounded-md">
                           Download
                        </a>
                    </div>
                `;
            }
            
            const likeId = `like-${postId}`;
            const liked = localStorage.getItem(likeId) === 'true';
            const likeButtonClass = liked ? 'bg-indigo-700' : 'bg-gray-600 hover:bg-gray-500';

            postElement.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <p class="text-sm font-medium text-indigo-400">${author}</p>
                    ${deleteButtonHtml}
                </div>
                <p class="text-slate-300 whitespace-pre-wrap">${post.text}</p>
                ${fileHtml}
                <div class="mt-4 pt-4 border-t border-slate-700 flex items-center justify-between">
                    <button data-post-id="${postId}" 
                            class="like-btn ${likeButtonClass} text-white py-1 px-3 rounded-md text-sm">
                        Like (<span id="${likeId}">${post.likes || 0}</span>)
                    </button>
                    <span class="text-xs text-slate-500">${postDate}</span>
                </div>
            `;
            
            return postElement;
        }

        // --- Global Event Listeners (Event Delegation) ---
        document.body.addEventListener('click', async (e) => {
            
            // --- Handle Like Button Clicks ---
            if (e.target.classList.contains('like-btn')) {
                const postId = e.target.dataset.postId;
                const likeId = `like-${postId}`;
                const postRef = doc(db, "portals/sda-portal/posts", postId);
                
                if (localStorage.getItem(likeId) !== 'true') {
                    // Like the post
                    localStorage.setItem(likeId, 'true');
                    e.target.classList.remove('bg-gray-600', 'hover:bg-gray-500');
                    e.target.classList.add('bg-indigo-700');
                    await updateDoc(postRef, { likes: increment(1) });
                } else {
                    // Unlike the post
                    localStorage.setItem(likeId, 'false');
                    e.target.classList.remove('bg-indigo-700');
                    e.target.classList.add('bg-gray-600', 'hover:bg-gray-500');
                    await updateDoc(postRef, { likes: increment(-1) });
                }
            }

            // --- Handle Delete Post Button Clicks ---
            if (e.target.classList.contains('delete-post-btn')) {
                const postId = e.target.dataset.postId;
                const fileUrl = e.target.dataset.fileUrl;
                
                if (confirm('Are you sure you want to delete this post?')) {
                    await deletePost(postId, fileUrl);
                }
            }
        });

        // --- Admin Delete Function ---
        async function deletePost(postId, fileUrl) {
            try {
                // 1. Delete the file from Storage (if it exists)
                if (fileUrl) {
                    const fileRef = ref(storage, fileUrl);
                    await deleteObject(fileRef);
                    console.log("File deleted from storage:", fileUrl);
                }

                // 2. Delete the main post document
                const postRef = doc(db, "portals/sda-portal/posts", postId);
                await deleteDoc(postRef);
                console.log("Post deleted:", postId);

            } catch (error) {
                console.error("Error deleting post:", error);
                alert("Error deleting post: " + error.message);
            }
        }

    </script>
</head>
<body class="bg-black text-slate-200 antialiased">

    <!-- Loading State -->
    <div id="loading-state" class="flex items-center justify-center min-h-screen">
        <div class="text-center">
            <p class="text-2xl font-semibold text-slate-300">Loading Portal...</p>
            <p class="text-slate-400 mt-2">Please wait.</p>
        </div>
    </div>

    <!-- Main Portal Content (Initially Hidden) -->
    <div id="portal-content" style="display: none;">
        
        <!-- Header -->
        <header class="bg-gray-950 shadow-lg sticky top-0 z-50">
            <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
                <a href="index.html" class="flex items-center space-x-3">
                    <img src="https://raw.githubusercontent.com/apiiela/sdaproductionswa/main/sdalogo.jpeg" alt="SDA Logo" class="h-10 w-10 object-contain">
                    <span class="text-xl font-bold text-slate-100">SDA Portal</span>
                </a>
                <div>
                    <span id="welcome-message" class="text-slate-300">Welcome!</span>
                    <a href="portal.html" onclick="sessionStorage.clear()" class="ml-4 text-indigo-400 hover:text-indigo-300 text-sm font-medium">
                        Logout
                    </a>
                </div>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main class="container mx-auto p-6 max-w-3xl">

            <!-- Admin-Only Post Form -->
            <section id="admin-post-form" class="mb-8" style="display: none;">
                <h2 class="text-2xl font-bold text-white mb-4">Create New Post</h2>
                <form id="post-form" class="bg-gray-800 border border-slate-700 rounded-lg p-6 space-y-4">
                    <textarea id="post-text" rows="4" 
                              class="w-full bg-gray-700 border border-slate-600 rounded-md p-3 text-slate-200" 
                              placeholder="What's on your mind?"></textarea>
                    
                    <div>
                        <label for="file-upload" class="block text-sm font-medium text-slate-300">Attach File (Optional)</label>
                        <input type="file" id="file-upload" 
                               class="mt-1 block w-full text-sm text-slate-400
                                      file:mr-4 file:py-2 file:px-4
                                      file:rounded-md file:border-0
                                      file:text-sm file:font-semibold
                                      file:bg-indigo-600 file:text-white
                                      hover:file:bg-indigo-700">
                    </div>

                    <div class="flex items-center justify-between">
                        <button type="submit" 
                                class="bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-indigo-700 transition-colors duration-300">
                            Post
                        </button>
                        <p id="status-message" class="text-sm text-yellow-400"></p>
                    </div>
                </form>
            </section>
            
            <!-- Posts Container -->
            <section id="posts-container">
                <!-- Posts will be loaded here by JavaScript -->
            </section>

        </main>
    </div>

</body>
</html>
