<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDA Portal - Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Simple pulse animation for new posts */
        @keyframes pulseIn {
            0% { transform: scale(0.95); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        .new-post-animation {
            animation: pulseIn 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-black text-slate-200 antialiased min-h-screen">

    <!-- --- Gatekeeper Script --- -->
    <script>
        const userRole = sessionStorage.getItem('userRole');
        const username = sessionStorage.getItem('username');
        
        // ** FIX for "Welcome null" **
        // Check for BOTH role and username. If either is missing, log out.
        if (!userRole || !username) {
            // Clear any partial session data
            sessionStorage.removeItem('userRole');
            sessionStorage.removeItem('username');
            // Redirect to login
            window.location.replace('portal.html');
        }
    </script>
    <!-- ----------------------- -->

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, addDoc, setDoc, updateDoc, deleteDoc, 
            onSnapshot, collection, query, serverTimestamp, increment, deleteField 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { 
            getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // --- Your Firebase Config ---
        const firebaseConfig = {
          apiKey: "AIzaSyCSNoTcrBdewkCjOdGoubaKkAo8ZYvUYj0",
          authDomain: "sdaproductions-7f04d.firebaseapp.com",
          projectId: "sdaproductions-7f04d",
          storageBucket: "sdaproductions-7f04d.appspot.com", // Corrected .appspot.com
          messagingSenderId: "372864946667",
          appId: "1:372864946667:web:ff348922a14a2a905009ae",
          measurementId: "G-54XVLP85NJ"
        };
        // -----------------------------

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const analytics = getAnalytics(app);

        // --- Global Variables ---
        const userRole = sessionStorage.getItem('userRole');
        const username = sessionStorage.getItem('username');
        let currentUserId = null; // To store Firebase Auth user ID
        
        // --- UI Elements ---
        const welcomeMessage = document.getElementById('welcomeMessage');
        const adminControls = document.getElementById('adminControls');
        const postForm = document.getElementById('postForm');
        const postContent = document.getElementById('postContent');
        const postFile = document.getElementById('postFile');
        const uploadProgress = document.getElementById('uploadProgress');
        const postList = document.getElementById('postList');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statusMessage = document.getElementById('statusMessage');

        // --- App Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Set Welcome Message & Admin UI
            if (welcomeMessage) {
                welcomeMessage.textContent = `Welcome, ${username}!`;
            }
            if (adminControls && userRole === 'admin') {
                adminControls.classList.remove('hidden');
            }

            // 2. Authenticate with Firebase
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    // User is signed in.
                    console.log('Firebase auth successful, user:', user.uid);
                    currentUserId = user.uid;
                    // 3. Load forum posts
                    loadPosts();
                } else {
                    // User is signed out. Try to sign in.
                    console.log('No user signed in, attempting anonymous auth...');
                    try {
                        const userCredential = await signInAnonymously(auth);
                        currentUserId = userCredential.user.uid;
                        console.log('Anonymous sign-in successful:', currentUserId);
                        // 3. Load forum posts
                        loadPosts();
                    } catch (error) {
                        console.error('Firebase sign-in error:', error);
                        statusMessage.textContent = 'Error connecting to portal. Please try again.';
                        statusMessage.classList.remove('hidden');
                    }
                }
            });

            // 4. Handle Admin Post Form Submission
            if (postForm) {
                postForm.addEventListener('submit', handlePostSubmit);
            }
        });

        // --- Post Loading ---
        function loadPosts() {
            if (!currentUserId) return; // Not logged in

            // Reference to the 'posts' collection
            const postsColRef = collection(db, "portals/sda-portal/posts");
            const q = query(postsColRef); // We can add orderBy here later if needed

            loadingSpinner.classList.remove('hidden');

            // Listen for real-time updates
            onSnapshot(q, (snapshot) => {
                loadingSpinner.classList.add('hidden');
                postList.innerHTML = ''; // Clear old posts

                if (snapshot.empty) {
                    postList.innerHTML = '<p class="text-slate-400 text-center">No announcements yet.</p>';
                    return;
                }

                snapshot.docChanges().forEach((change) => {
                    const post = change.doc.data();
                    const postId = change.doc.id;
                    const postElement = createPostElement(post, postId, change.type);
                    
                    if (change.type === "added") {
                        // Add new posts to the top
                        postList.prepend(postElement);
                    }
                    if (change.type === "modified") {
                        // Find and replace the modified post
                        const oldElement = document.getElementById(`post-${postId}`);
                        if (oldElement) {
                            oldElement.replaceWith(postElement);
                        }
                    }
                    if (change.type === "removed") {
                        // Find and remove the post
                        const oldElement = document.getElementById(`post-${postId}`);
                        if (oldElement) {
                            oldElement.remove();
                        }
                    }
                });
            }, (error) => {
                console.error("Error loading posts: ", error);
                statusMessage.textContent = 'Error loading posts. ' + error.message;
                statusMessage.classList.remove('hidden');
            });
        }

        // --- Create Post Element ---
        function createPostElement(post, postId, changeType) {
            const postDiv = document.createElement('div');
            postDiv.id = `post-${postId}`;
            postDiv.className = 'bg-gray-900 border border-slate-800 shadow-xl rounded-lg overflow-hidden';
            
            // Add animation for new posts
            if (changeType === "added") {
                postDiv.classList.add('new-post-animation');
            }

            // Format date
            const date = post.createdAt ? post.createdAt.toDate().toLocaleString('en-AU') : 'Just now';

            // Check if user has liked this post (from localStorage)
            const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '{}');
            const hasLiked = likedPosts[postId] === true;

            // Admin Delete Button
            const deleteButtonHtml = userRole === 'admin' ? `
                <button data-post-id="${postId}" data-file-path="${post.filePath || ''}" class="delete-post-btn text-slate-500 hover:text-red-500 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            ` : '';

            // File Download Link
            const fileLinkHtml = post.fileURL ? `
                <div class="mt-4">
                    <a href="${post.fileURL}" target="_blank" 
                       class="inline-flex items-center space-x-2 text-indigo-400 hover:text-indigo-300 font-medium py-2 px-4 bg-indigo-900/50 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>${post.fileName || 'Download File'}</span>
                    </a>
                </div>
            ` : '';

            postDiv.innerHTML = `
                <div class="p-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-slate-400">Posted by ${post.postedBy} on ${date}</p>
                        </div>
                        ${deleteButtonHtml}
                    </div>
                    <p class="text-lg text-slate-100 whitespace-pre-wrap mt-4 mb-5">${post.content}</p>
                    ${fileLinkHtml}
                </div>
                <!-- Footer for Likes -->
                <div class="bg-gray-950/50 border-t border-slate-800 px-6 py-4">
                    <button data-post-id="${postId}" class="like-btn flex items-center space-x-2 text-slate-400 hover:text-red-500 transition-colors ${hasLiked ? 'text-red-500' : ''}">
                        <svg class="w-6 h-6" fill="${hasLiked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.5l1.318-1.182a4.5 4.5 0 116.364 6.364L12 20.25l-7.682-7.682a4.5 4.5 0 010-6.364z"></path></svg>
                        <span class="font-medium">${post.likes || 0}</span>
                    </button>
                </div>
            `;

            // --- Add Event Listeners ---
            // Like Button
            const likeBtn = postDiv.querySelector('.like-btn');
            if (likeBtn) {
                likeBtn.addEventListener('click', () => handleLike(postId, hasLiked));
            }
            // Delete Button
            const deleteBtn = postDiv.querySelector('.delete-post-btn');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', () => handleDeletePost(postId, deleteBtn.dataset.filePath));
            }

            return postDiv;
        }

        // --- Post Form Handling ---
        async function handlePostSubmit(e) {
            e.preventDefault();
            if (!currentUserId || userRole !== 'admin') return;

            const content = postContent.value;
            const file = postFile.files[0];

            if (!content && !file) {
                alert("You must include either text or a file.");
                return;
            }

            statusMessage.textContent = 'Uploading post...';
            statusMessage.classList.remove('hidden');
            uploadProgress.classList.remove('hidden');
            uploadProgress.value = 0;

            try {
                let fileURL = null;
                let filePath = null;
                let fileName = null;

                // 1. If file exists, upload it first
                if (file) {
                    filePath = `forum-uploads/${currentUserId}_${Date.now()}_${file.name}`;
                    fileName = file.name;
                    const fileRef = ref(storage, filePath);
                    const uploadTask = uploadBytesResumable(fileRef, file);

                    // Wait for upload to complete
                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed',
                            (snapshot) => {
                                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                                uploadProgress.value = progress;
                            },
                            (error) => {
                                console.error("Upload failed:", error);
                                reject(error);
                            },
                            async () => {
                                fileURL = await getDownloadURL(uploadTask.snapshot.ref);
                                resolve();
                            }
                        );
                    });
                }

                // 2. Add post document to Firestore
                const postsColRef = collection(db, "portals/sda-portal/posts");
                await addDoc(postsColRef, {
                    postedBy: username,
                    content: content,
                    createdAt: serverTimestamp(),
                    likes: 0,
                    fileURL: fileURL,
                    filePath: filePath,
                    fileName: fileName
                });

                // 3. Reset form and show success
                postForm.reset();
                uploadProgress.classList.add('hidden');
                statusMessage.textContent = 'Post created successfully!';
                setTimeout(() => statusMessage.classList.add('hidden'), 3000);

            } catch (error) {
                console.error("Error creating post:", error);
                statusMessage.textContent = 'Error creating post. ' + error.message;
            }
        }

        // --- Handle Like ---
        async function handleLike(postId, hasAlreadyLiked) {
            if (hasAlreadyLiked) {
                console.log("You already liked this post.");
                return;
            }

            const postRef = doc(db, "portals/sda-portal/posts", postId);
            
            try {
                // Update likes in Firestore
                await updateDoc(postRef, {
                    likes: increment(1)
                });

                // Save to localStorage to prevent re-liking
                const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '{}');
                likedPosts[postId] = true;
                localStorage.setItem('likedPosts', JSON.stringify(likedPosts));

            } catch (error) {
                console.error("Error liking post:", error);
            }
        }

        // --- Handle Delete Post ---
        async function handleDeletePost(postId, filePath) {
            if (userRole !== 'admin') return;

            if (!confirm("Are you sure you want to delete this post? This action cannot be undone.")) {
                return;
            }

            try {
                // 1. Delete the file from Storage (if it exists)
                if (filePath) {
                    const fileRef = ref(storage, filePath);
                    await deleteObject(fileRef);
                    console.log("File deleted from storage.");
                }

                // 2. Delete the post from Firestore
                const postRef = doc(db, "portals/sda-portal/posts", postId);
                await deleteDoc(postRef);
                console.log("Post deleted from Firestore.");

            } catch (error) {
                console.error("Error deleting post:", error);
                // Handle case where file doesn't exist (e.g., already deleted)
                if (error.code === 'storage/object-not-found') {
                    console.warn("File not found in storage, but deleting post doc anyway.");
                    // Still try to delete the firestore doc
                    try {
                        const postRef = doc(db, "portals/sda-portal/posts", postId);
                        await deleteDoc(postRef);
                    } catch (dbError) {
                        console.error("Error deleting post doc:", dbError);
                    }
                } else {
                    alert("Error deleting post: " + error.message);
                }
            }
        }

    </script>
